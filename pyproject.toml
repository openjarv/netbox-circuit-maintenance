[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "netbox-circuit-maintenance"
version = "0.1.0"
description = "A NetBox plugin for tracking planned circuit maintenance windows"
readme = "README.md"
license = {text = "Apache-2.0"}
requires-python = ">=3.10"
authors = [
    {name = "AcrossTheWire", email = "engineering@acrossthewire.io"},
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: Django",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Networking",
]
dependencies = []

[project.optional-dependencies]
dev = [
    "black>=24.0,<25",
    "flake8>=7.0,<8",
    "isort>=5.13,<6",
    "pytest>=8.0,<9",
    "pytest-django>=4.8,<5",
]

[tool.setuptools.packages.find]
include = ["netbox_circuit_maintenance*"]

[tool.black]
line-length = 120
target-version = ["py310"]

[tool.isort]
profile = "black"
line_length = 120

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "netbox.settings"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"